# Vixera One — repository verification.
#
# Every job runs the same command a contributor runs locally (see README
# "Quick start"); CI adds nothing that cannot be reproduced on a laptop. No
# job needs a secret: provider credentials are never required to prove the
# code, and the Supabase anon key is not needed to build the frontend.
#
# `ci-ok` is the one status to require in branch protection (docs/ci.md).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same ref supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"   # incremental artifacts bloat the cache and help nothing in CI
  RUSTFLAGS: "-D warnings"

jobs:
  # Same-repo branches already run on push; only run the pull_request event
  # for forks, so a PR does not run everything twice.
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - run: echo "run"

  hygiene:
    name: hygiene · secrets, migrations
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: No secrets in tracked files
        run: bash scripts/check-secrets.sh
      - name: Migration sanity
        run: bash scripts/check-migrations.sh

  typescript:
    name: typescript · typecheck, test, build
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4          # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck every workspace package
        run: pnpm typecheck
      - name: Vitest (all packages, fixture-only, deterministic)
        run: pnpm test
      - name: Production frontend build
        # No .env: config is read at runtime, so the bundle must build without one.
        run: pnpm build:desktop
      - name: Dev fixtures stay out of the entry chunk
        run: |
          set -euo pipefail
          entry="$(ls apps/desktop/dist/assets/index-*.js)"
          if grep -q "Northwind" "$entry"; then
            echo "::error::dev fixture world is in the production entry chunk ($entry)"; exit 1
          fi
          echo "entry chunk is clean: $entry"

  edge-functions:
    name: edge functions · deno check, test
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check every function and run the shared-layer tests
        run: pnpm functions:check
        env:
          DENO_NO_UPDATE_CHECK: "1"

  database:
    name: database · migrations, seed, invariants
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply every migration + seed to a throwaway PostgreSQL and assert invariants
        # ubuntu-24.04 ships PostgreSQL 16 binaries; the script auto-detects PGBIN.
        run: pnpm db:verify

  live-postgrest:
    name: database · store against real PostgREST
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      POSTGREST_VERSION: v12.2.3
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch PostgREST
        run: |
          set -euo pipefail
          mkdir -p /tmp/vixera-live-stack
          curl -fsSL "https://github.com/PostgREST/postgrest/releases/download/${POSTGREST_VERSION}/postgrest-${POSTGREST_VERSION}-linux-static-x86-64.tar.xz" \
            | tar -xJ -C /tmp/vixera-live-stack
          /tmp/vixera-live-stack/postgrest --version
      - name: Store suite against PostgREST (default row cap)
        run: pnpm test:live
      - name: Store suite with the row cap at 5 — every read must still return the whole set
        run: VIXERA_REST_MAX_ROWS=5 pnpm test:live
      - name: Stop the stack
        if: always()
        run: pnpm db:live:down

  rust:
    name: rust · check workspace, test platform crate
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libgtk-3-dev libsoup-3.0-dev libssl-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # keyed on Cargo.lock; shared between check and test
          shared-key: workspace
      - name: cargo check --workspace
        run: cargo check --workspace --locked
      - name: cargo test -p vixera-platform
        run: cargo test -p vixera-platform --locked

  # The one check to require in branch protection. Fails if any job failed
  # or was cancelled; passes only when every job passed.
  ci-ok:
    name: ci-ok
    needs: [hygiene, typescript, edge-functions, database, live-postgrest, rust]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every job passed
        run: |
          echo '${{ toJSON(needs) }}' | tee needs.json
          if grep -qE '"result": "(failure|cancelled|skipped)"' needs.json; then
            echo "::error::a required job did not pass"; exit 1
          fi
