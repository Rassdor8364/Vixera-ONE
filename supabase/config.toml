# Supabase CLI configuration for Vixera One (ai.vixera.one).
# Everything needed to recreate the database lives in migrations/ and seed.sql.
project_id = "vixera-one"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "100MiB"

[storage.buckets.artifacts]
public = false
file_size_limit = "100MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:1420"
additional_redirect_urls = ["http://127.0.0.1:1420", "http://localhost:1420", "vixera-one://auth"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

# Edge Functions. Provider secrets are set with `supabase secrets set`, never here.
[functions.action-dispatch]
verify_jwt = true
import_map = "./functions/deno.json"

[functions.connector-sync]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.connector-link]
verify_jwt = true
import_map = "./functions/deno.json"

[functions.ingest-process]
verify_jwt = true
import_map = "./functions/deno.json"

[analytics]
enabled = false
